<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Portfolio Admin — Sign in</title>
<link rel="stylesheet" href="admin.css">
<style>
  /* login-specific layout */
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-card {
    width: min(400px, calc(100vw - 32px));
    background: #0d0d0d;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 14px;
    padding: 36px 32px 32px;
    position: relative;
    overflow: hidden;
  }
  .login-card::before {
    content: "";
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--nb), transparent);
    opacity: .8;
  }
  .login-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .login-logo .mark {
    width: 10px; height: 10px; border-radius: 2px;
    background: var(--nb);
    box-shadow: 0 0 12px var(--nb), 0 0 32px rgba(44,224,109,.35);
  }
  .login-logo .name { font-weight: 700; letter-spacing: .18em; font-size: 13px; }
  .login-sub { color: var(--dim); font-size: 12px; margin-bottom: 28px; letter-spacing: .06em; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin-bottom: 6px; }
  .field input {
    width: 100%; box-sizing: border-box;
    background: #050505;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 8px;
    color: #fff; font: inherit; font-size: 14px;
    padding: 11px 13px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .field input:focus { border-color: var(--nb); box-shadow: 0 0 0 3px rgba(44,224,109,.12); }
  .login-err {
    display: none;
    color: var(--red); font-size: 12.5px;
    margin: 2px 0 14px; min-height: 16px;
  }
  .login-err.show { display: block; }
  #loginBtn { width: 100%; justify-content: center; margin-top: 4px; }
  .login-foot { margin-top: 22px; text-align: center; color: rgba(255,255,255,.25); font-size: 11px; letter-spacing: .1em; }
</style>
</head>
<body>
  <main class="login-card">
    <div class="login-logo"><span class="mark"></span><span class="name">PORTFOLIO</span></div>
    <p class="login-sub">Admin panel — sign in to manage site content</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <p class="login-err" id="loginErr" role="alert"></p>
      <button type="submit" class="btn btn-primary" id="loginBtn">Sign in</button>
    </form>

    <p class="login-foot">Protected area · Firebase Auth</p>
  </main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { FIREBASE_CONFIG } from "../firebase-config.js";

  const errEl = document.getElementById("loginErr");
  const btn = document.getElementById("loginBtn");
  const form = document.getElementById("loginForm");

  try { initializeApp(FIREBASE_CONFIG); }
  catch (e) { showError("Firebase config is missing — fill in firebase-config.js first."); }

  const auth = getAuth();

  // Already signed in? Straight to the dashboard.
  onAuthStateChanged(auth, (user) => {
    if (user) location.replace("dashboard.html");
  });

  const ERRORS = {
    "auth/invalid-credential": "Wrong email or password.",
    "auth/wrong-password": "Wrong email or password.",
    "auth/user-not-found": "Wrong email or password.",
    "auth/too-many-requests": "Too many attempts — try again in a minute.",
    "auth/network-request-failed": "Network error — check your connection.",
    "auth/invalid-email": "That email address doesn't look right."
  };

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    if (!email || !password) { showError("Enter your email and password."); return; }

    btn.disabled = true;
    btn.textContent = "Signing in…";
    errEl.classList.remove("show");

    try {
      await signInWithEmailAndPassword(auth, email, password);
      location.replace("dashboard.html");
    } catch (err) {
      showError(ERRORS[err.code] || "Sign-in failed (" + err.code + ").");
      btn.disabled = false;
      btn.textContent = "Sign in";
    }
  });

  function showError(msg) {
    errEl.textContent = msg;
    errEl.classList.add("show");
  }
</script>
</body>
</html>
